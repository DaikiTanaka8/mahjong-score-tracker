# mahjong-score-tracker 用の Nginx 設定（/etc/nginx/conf.d/ に配置する）
#
# ブラウザ → Nginx(80番) ─┬─ /      → Next.js の静的ファイル（frontend/out の中身）
#                          └─ /api/  → FastAPI (127.0.0.1:8000)
#
# フロントエンドは API を /api/... の相対パスで呼ぶため、
# Nginx が同じ入口(80番)で受けて転送すれば、CORS の設定は不要になる。
server {
    # default_server: IPアドレスなど、どの名前に一致しないアクセスもこの設定で受ける
    # server_name を "_" にしない理由: Nginx 標準の設定が "_" を使っており、
    # 同名だと後から読み込まれるこちらが無視されてしまうため
    listen 80 default_server;
    server_name mahjong-score-tracker;

    root /usr/share/nginx/html;
    index index.html;

    # 「/games」のように末尾の / がないアクセスを、「/games/」に直すとき、
    # ホスト名やポート番号を含めない(SSMトンネル経由 localhost:8081 でも壊れないように)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 画面（Next.js の静的エクスポート）
    #   /games/ → games/index.html のように、フォルダごとに index.html がある(trailingSlash)。
    #   存在しないパスは、Next.js が作った 404.html を返す。
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # ビルドで名前が変わる JS/CSS は、長くキャッシュしてよい
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API: FastAPI に転送する
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
